# Start window numbering at 1
set -g base-index 1

# Status bar at top
set -g status-position top

# Tab-like styling
set -g status-style 'bg=#1a1a1a fg=#888888'
set -g status-left ''
set -g status-right ''
# Tab text colour. agent-tab-status.sh overrides these two per window to show
# what the agent in it is doing; the values here are the plain theme, so a tab
# without an agent is untouched.
set -g @agent-tab-color '#888888'
set -g @agent-tab-color-cur '#ffffff'
set -g window-status-format '#[fg=#{@agent-tab-color}] #W#{?#{>:#{window_panes},1},[#{window_panes}],} #[default]'
set -g window-status-current-format '#[bg=#444444,fg=#{@agent-tab-color-cur}] #W#{?#{>:#{window_panes},1},[#{window_panes}],} #[default]'
set -g status-interval 1
setw -g automatic-rename on
set -g window-status-separator ''

# Enable mouse for clicking tabs
set -g mouse on

# Enable OSC 52 clipboard (works over SSH)
set -g set-clipboard on

# Shortcuts (same as vim floaterm)
bind-key -n C-t new-window
bind-key -n C-w kill-pane
bind-key -n C-h previous-window
bind-key -n C-l next-window
bind-key -n C-j select-pane -t :.+
bind-key -n C-k select-pane -t :.-
bind-key -n C-s split-window -h


# Reduce escape delay (better for vim)
set -sg escape-time 10

# Agent tab names: label tabs running an agent with one word
# (script: ~/.tmux/agent-tab-name.sh, installed by vim-config setup.sh)
# Machine-specific settings such as @agent-tab-base-url belong in ~/.tmux.local,
# which is not tracked; without it the script looks for an OpenAI-compatible
# server on localhost and uses the first model it advertises.
if-shell "test -f $HOME/.tmux.local" "source-file $HOME/.tmux.local"
set-hook -g session-created "run-shell -b \"$HOME/.tmux/agent-tab-name.sh --watch\""
set-hook -g after-new-session "run-shell -b \"$HOME/.tmux/agent-tab-name.sh --watch\""
set-hook -g client-attached "run-shell -b \"$HOME/.tmux/agent-tab-name.sh --watch\""
bind-key N "run-shell -b \"$HOME/.tmux/agent-tab-name.sh --force-current\""

# Agent tab status: colour those tabs by what the agent is doing. Appended with
# -ga so both watchers run off the same hooks; each is guarded by its own
# pidfile, so a config reload cannot stack up loops.
set-hook -ga session-created "run-shell -b \"$HOME/.tmux/agent-tab-status.sh --watch\""
set-hook -ga after-new-session "run-shell -b \"$HOME/.tmux/agent-tab-status.sh --watch\""
set-hook -ga client-attached "run-shell -b \"$HOME/.tmux/agent-tab-status.sh --watch\""
bind-key S "run-shell -b \"$HOME/.tmux/agent-tab-status.sh clear-all\""
